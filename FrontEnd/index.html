<!doctype html>
<html lang="id">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Toko Sembako</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/sweetalert-custom.css" />
</head>

<body>
  <header class="header">
    <div class="header-inner header-home">
      <div class="logo">LOGO</div>
      <div class="search-box">
        <input type="text" id="searchInput" placeholder="Cari produk..." />
        <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="8"></circle>
          <path d="m21 21-4.35-4.35"></path>
        </svg>
      </div>
      <div class="header-icons">
        <a href="profile.html" class="icon-btn" title="Profil">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
            <circle cx="12" cy="7" r="4"></circle>
          </svg>
        </a>
        <a href="keranjang.html" class="icon-btn" title="Keranjang">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="9" cy="21" r="1"></circle>
            <circle cx="20" cy="21" r="1"></circle>
            <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
          </svg>
          <span id="cartBadge" class="badge hidden">0</span>
        </a>
        <button class="icon-btn" onclick="openModal('csModal')" title="Customer Service">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path
              d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z">
            </path>
          </svg>
        </button>
      </div>
    </div>
  </header>

  <main class="container page-main">
    <section class="categories-wrapper">
      <div class="categories" id="categoryList"></div>
    </section>
    <section class="product-grid" id="productGrid"></section>
  </main>



  <div class="modal" id="csModal">
    <div class="modal-content">
      <span class="close" onclick="closeModal('csModal')">&times;</span>
      <h2>Customer Service</h2>
      <div class="cs-info">
        <p>📧 moreno@gmail.com</p>
        <p>📞 +62 812-7891-6777</p>
        <p>🕒 Senin - Minggu, 08:00 - 20:00</p>
      </div>
      <button class="btn-primary" onclick="closeModal('csModal')">
        Tutup
      </button>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="js/sweetalert-custom.js"></script>
  <script src="js/script.js?v=checkout-popup-action-1"></script>
</body>

</html>
