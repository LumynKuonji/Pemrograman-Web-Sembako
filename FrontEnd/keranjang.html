<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Keranjang Belanja - Sembako</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="header">
        <div class="header-inner">
            <button type="button" class="menu-btn btn-back" onclick="window.location.href='index.html'" aria-label="Kembali">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
            </button>
            <div class="logo">LOGO</div>
            <div class="header-spacer"></div>
            <div class="header-icons">
                <span class="cart-header-count" id="cartHeaderCount">0 item</span>
            </div>
        </div>
    </header>

    <div class="container cart-page">
        <h1 class="page-title">Keranjang Belanja</h1>
        
        <div id="cartList"></div>

        <div id="cartRecommendations"></div>

        <div id="cartSummary" class="cart-total" style="margin-top: 20px;">
            <div class="cart-row">
                <span>Total Barang</span>
                <strong id="totalItems">0</strong>
            </div>
            <div class="cart-row total">
                <span>Total Harga</span>
                <strong id="totalPrice">Rp 0</strong>
            </div>
            <button onclick="openPaymentModal()" class="btn-primary" style="width: 100%; padding: 16px; font-size: 18px;">
             Checkout Sekarang
            </button>
        </div>
    </div>

    <script src="script.js"></script>

<div id="paymentModal" class="modal">
    <div class="modal-content payment-modal">
        <div class="modal-header">
            <h2>Konfirmasi Pembayaran</h2>
            <button class="close" onclick="closePaymentModal()">×</button>
        </div>
        
        <div class="payment-content">
            <div class="section">
                <h3>Ringkasan Pesanan</h3>
                <div id="orderItems"></div>
            </div>

            <div class="section">
                <h3>Alamat Pengiriman</h3>
                <div id="paymentAddress" class="address-box"></div>
            </div>

            <div class="section">
                <h3>Pilih Metode Pembayaran</h3>
                <div class="payment-methods" id="paymentMethods">
                </div>
            </div>

            <div class="total-section">
                <div class="total-row">
                    <span>Total Pembayaran</span>
                    <span id="modalTotal" class="total-amount"></span>
                </div>
            </div>
        </div>

        <div class="modal-footer">
            <button class="btn-secondary" onclick="closePaymentModal()">Batalkan</button>
            <button class="btn-primary" onclick="confirmPayment()">Bayar Sekarang</button>
        </div>
    </div>
</div>
</body>
</html>
