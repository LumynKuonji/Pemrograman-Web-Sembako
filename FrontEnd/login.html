<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Masuk - Toko Sembako</title>
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/sweetalert-custom.css" />
  </head>
  <body>
    <header class="header">
      <div class="header-inner">
        <button
          type="button"
          class="menu-btn btn-back"
          onclick="goBackFromLogin()"
          aria-label="Kembali"
        >
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M15 18l-6-6 6-6" />
          </svg>
        </button>
        <div class="logo">LOGO</div>
      </div>
    </header>

    <style>
      .login-tabs {
        display: flex;
        margin-bottom: 25px;
        border-bottom: 2px solid #e2e8f0;
      }
      .tab-btn {
        flex: 1;
        padding: 12px;
        background: none;
        border: none;
        font-weight: 600;
        font-size: 14px;
        color: #718096;
        cursor: pointer;
        transition: all 0.3s ease;
        text-align: center;
      }
      .tab-btn.active {
        color: #10b981;
        border-bottom: 3px solid #10b981;
        margin-bottom: -2px;
      }
      .btn-secondary {
        background-color: #f3f4f6;
        color: #374151;
        border: 1px solid #d1d5db;
        border-radius: 6px;
        cursor: pointer;
        font-weight: 500;
        transition: all 0.2s;
      }
      .btn-secondary:hover {
        background-color: #e5e7eb;
      }
      .btn-secondary:disabled {
        background-color: #f3f4f6;
        color: #9ca3af;
        cursor: not-allowed;
      }
    </style>

    <div class="container login-page">
      <h1 class="page-title">Masuk Akun</h1>
      <p class="login-subtitle">
        Login diperlukan untuk menambah barang ke keranjang dan checkout.
      </p>

      <div class="login-card">


        <label>Email</label>
        <input
          type="email"
          id="loginEmail"
          placeholder="Masukkan email Anda"
          autocomplete="new-password"
          readonly
          onfocus="this.removeAttribute('readonly')"
        />

        <!-- Password section -->
        <div id="passwordSection">
          <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 10px;">
            <label style="margin-bottom: 0;">Password</label>
            <a href="javascript:void(0)" onclick="handleForgotPassword()" style="font-size: 13px; color: #10b981; text-decoration: none; font-weight: 600;">Lupa Password?</a>
          </div>
          <div class="password-wrapper" style="margin-top: 8px;">
            <input
              type="password"
              id="loginPassword"
              placeholder="Minimal 6 karakter"
              autocomplete="new-password"
              readonly
              onfocus="this.removeAttribute('readonly')"
            />
            <button type="button" class="password-toggle-btn" onclick="togglePasswordVisibility('loginPassword', this)" tabindex="-1" aria-label="Tampilkan password">
              <svg class="eye-open" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
              <svg class="eye-closed" style="display: none;" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                <line x1="1" y1="1" x2="23" y2="23"></line>
              </svg>
            </button>
          </div>
        </div>



        <button class="btn-primary login-btn" onclick="submitLogin()" style="margin-top: 20px;">
          Masuk
        </button>



        <p class="login-switch">
          Belum punya akun? <a href="register.html">Daftar di sini</a>
        </p>


      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="js/sweetalert-custom.js"></script>
    <script src="js/script.js?v=orders-account-fix-2"></script>
    <script>


      document.addEventListener("DOMContentLoaded", () => {
        // Clear autofill on load
        setTimeout(() => {
          const emailInput = document.getElementById("loginEmail");
          const passInput = document.getElementById("loginPassword");
          if (emailInput) {
            emailInput.value = "";
            emailInput.removeAttribute("readonly");
          }
          if (passInput) {
            passInput.value = "";
            passInput.removeAttribute("readonly");
          }
        }, 50);

        if (isLoggedIn()) {
          const user = JSON.parse(localStorage.getItem("sembako_user"));
          if (user && user.is_admin) {
            window.location.href = "../Admin/index.html";
          } else {
            window.location.href = getReturnUrl() || "index.html";
          }
        }
        
        document.getElementById("loginPassword")?.addEventListener("keydown", (e) => {
          if (e.key === "Enter") submitLogin();
        });
        document.getElementById("loginOTP")?.addEventListener("keydown", (e) => {
          if (e.key === "Enter") submitLogin();
        });
      });
    </script>
  </body>
</html>
