<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Masuk - Toko Sembako</title>
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/sweetalert-custom.css" />
  </head>
  <body>
    <header class="header">
      <div class="header-inner">
        <button
          type="button"
          class="menu-btn btn-back"
          onclick="goBackFromLogin()"
          aria-label="Kembali"
        >
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M15 18l-6-6 6-6" />
          </svg>
        </button>
        <div class="logo">LOGO</div>
      </div>
    </header>

    <style>
      .login-tabs {
        display: flex;
        margin-bottom: 25px;
        border-bottom: 2px solid #e2e8f0;
      }
      .tab-btn {
        flex: 1;
        padding: 12px;
        background: none;
        border: none;
        font-weight: 600;
        font-size: 14px;
        color: #718096;
        cursor: pointer;
        transition: all 0.3s ease;
        text-align: center;
      }
      .tab-btn.active {
        color: #10b981;
        border-bottom: 3px solid #10b981;
        margin-bottom: -2px;
      }
      .btn-secondary {
        background-color: #f3f4f6;
        color: #374151;
        border: 1px solid #d1d5db;
        border-radius: 6px;
        cursor: pointer;
        font-weight: 500;
        transition: all 0.2s;
      }
      .btn-secondary:hover {
        background-color: #e5e7eb;
      }
      .btn-secondary:disabled {
        background-color: #f3f4f6;
        color: #9ca3af;
        cursor: not-allowed;
      }
    </style>

    <div class="container login-page">
      <h1 class="page-title">Masuk Akun</h1>
      <p class="login-subtitle">
        Login diperlukan untuk menambah barang ke keranjang dan checkout.
      </p>

      <div class="login-card">
        <!-- Tab selector -->
        <div class="login-tabs">
          <button id="tabPassword" class="tab-btn active" onclick="switchLoginTab('password')">Dengan Password</button>
          <button id="tabOTP" class="tab-btn" onclick="switchLoginTab('otp')">Dengan OTP (Email)</button>
        </div>

        <label>Email</label>
        <input
          type="email"
          id="loginEmail"
          placeholder="Masukkan email Anda"
          autocomplete="email"
        />

        <!-- Password section -->
        <div id="passwordSection">
          <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 10px;">
            <label style="margin-bottom: 0;">Password</label>
            <a href="javascript:void(0)" onclick="handleForgotPassword()" style="font-size: 13px; color: #10b981; text-decoration: none; font-weight: 600;">Lupa Password?</a>
          </div>
          <input
            type="password"
            id="loginPassword"
            placeholder="Minimal 6 karakter"
            autocomplete="current-password"
            style="margin-top: 8px;"
          />
        </div>

        <!-- OTP section (hidden by default) -->
        <div id="otpSection" style="display: none; margin-top: 10px;">
          <div style="display: flex; justify-content: space-between; align-items: center;">
            <label style="margin-bottom: 0;">Verifikasi OTP</label>
            <button class="btn-secondary" id="btnRequestOTP" onclick="requestLoginOTP()" style="padding: 6px 12px; font-size: 12px; white-space: nowrap;">Kirim Kode OTP</button>
          </div>
          
          <input
            type="text"
            id="loginOTP"
            placeholder="Masukkan 6 digit OTP"
            maxlength="6"
            style="letter-spacing: 4px; text-align: center; font-size: 18px; font-weight: bold; margin-top: 8px;"
          />
        </div>

        <button class="btn-primary login-btn" onclick="submitLogin()" style="margin-top: 20px;">
          Masuk
        </button>



        <p class="login-switch">
          Belum punya akun? <a href="register.html">Daftar di sini</a>
        </p>

        <div class="login-hint">
          <strong>Sistem Terintegrasi Mail:</strong><br />
          Email OTP / verifikasi dikirim nyata (jika SMTP aktif) atau tersimulasi di folder:<br />
          <code style="word-break: break-all; background: #edf2f7; padding: 2px 6px; border-radius: 4px; font-size: 11px;">BackEnd/sent_emails/</code>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="js/sweetalert-custom.js"></script>
    <script src="js/script.js?v=orders-account-fix-1"></script>
    <script>


      document.addEventListener("DOMContentLoaded", () => {
        if (isLoggedIn()) window.location.href = getReturnUrl() || "index.html";
        
        document.getElementById("loginPassword")?.addEventListener("keydown", (e) => {
          if (e.key === "Enter") submitLogin();
        });
        document.getElementById("loginOTP")?.addEventListener("keydown", (e) => {
          if (e.key === "Enter") submitLogin();
        });
      });
    </script>
  </body>
</html>
