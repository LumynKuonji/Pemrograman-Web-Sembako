<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Daftar Akun - Toko Sembako</title>
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/sweetalert-custom.css" />
  </head>
  <body>
    <header class="header">
      <div class="header-inner">
        <button
          type="button"
          class="menu-btn btn-back"
          onclick="window.location.href = 'login.html'"
          aria-label="Kembali"
        >
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M15 18l-6-6 6-6" />
          </svg>
        </button>
        <div class="logo">LOGO</div>
        <div class="header-icons">
          <a href="index.html" class="header-auth-btn">Beranda</a>
        </div>
      </div>
    </header>

    <div class="container login-page">
      <h1 class="page-title">Daftar Akun Baru</h1>

      <div class="login-card">
        <label>Nama Lengkap</label>
        <input
          type="text"
          id="reg_nama"
          placeholder="Nama Anda"
          autocomplete="name"
        />

        <label>Email</label>
        <input
          type="email"
          id="reg_email"
          placeholder="email@contoh.com"
          autocomplete="email"
        />

        <label>No. Telepon (opsional)</label>
        <input type="tel" id="reg_telepon" placeholder="+62 8xx-xxxx-xxxx" />

        <label>Password</label>
        <div class="password-wrapper">
          <input
            type="password"
            id="reg_password"
            placeholder="Minimal 6 karakter"
            autocomplete="new-password"
          />
          <button type="button" class="password-toggle-btn" onclick="togglePasswordVisibility('reg_password', this)" tabindex="-1" aria-label="Tampilkan password">
            <svg class="eye-open" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
              <circle cx="12" cy="12" r="3"></circle>
            </svg>
            <svg class="eye-closed" style="display: none;" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
              <line x1="1" y1="1" x2="23" y2="23"></line>
            </svg>
          </button>
        </div>

        <label>Konfirmasi Password</label>
        <div class="password-wrapper">
          <input
            type="password"
            id="reg_confirm"
            placeholder="Ulangi password"
            autocomplete="new-password"
          />
          <button type="button" class="password-toggle-btn" onclick="togglePasswordVisibility('reg_confirm', this)" tabindex="-1" aria-label="Tampilkan password">
            <svg class="eye-open" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
              <circle cx="12" cy="12" r="3"></circle>
            </svg>
            <svg class="eye-closed" style="display: none;" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
              <line x1="1" y1="1" x2="23" y2="23"></line>
            </svg>
          </button>
        </div>

        <button class="btn-primary login-btn" onclick="handleRegister()">
          Daftar Sekarang
        </button>

        <p class="login-switch">
          Sudah punya akun? <a href="login.html">Masuk di sini</a>
        </p>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="js/sweetalert-custom.js"></script>
    <script src="js/script.js?v=orders-account-fix-2"></script>
    <script>
      document.addEventListener("DOMContentLoaded", () => {
        if (isLoggedIn()) window.location.href = "index.html";
      });
    </script>
  </body>
</html>
